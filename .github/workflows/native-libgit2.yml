name: native-libgit2

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
            rust: x86_64-pc-windows-msvc
            kind: native
          - target: win32-arm64
            os: windows-11-arm
            rust: aarch64-pc-windows-msvc
            kind: native
          - target: linux-x64
            os: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
            kind: native
          - target: linux-arm64
            os: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
            kind: native
          - target: linux-armhf
            os: ubuntu-24.04
            rust: armv7-unknown-linux-gnueabihf
            kind: cross
          - target: darwin-x64
            os: macos-15-intel
            rust: x86_64-apple-darwin
            kind: native
          - target: darwin-arm64
            os: macos-15
            rust: aarch64-apple-darwin
            kind: native
          - target: alpine-x64
            os: ubuntu-24.04
            rust: x86_64-unknown-linux-musl
            kind: alpine
          - target: alpine-arm64
            os: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-musl
            kind: alpine
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.kind != 'alpine'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.kind != 'alpine'
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust }}
      - name: Set up ARMhf cross compiler
        if: matrix.kind == 'cross'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - run: npm ci
        if: matrix.kind != 'alpine'
      - name: Test host Rust implementation
        if: matrix.kind == 'native'
        run: npm run check:native && npm run test:native
      - name: Build native module
        if: matrix.kind == 'native'
        run: npm run build:native -- --target ${{ matrix.rust }}
      - name: Cross-build ARMhf module
        if: matrix.kind == 'cross'
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          npm run check:native
          npm run test:native
          npm run build:native -- --target ${{ matrix.rust }}
      - name: Build and test on musl
        if: matrix.kind == 'alpine'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work rust:alpine sh -euc '
            apk add --no-cache build-base cmake perl pkgconf openssl-dev nodejs npm python3 git
            npm ci
            npm run check:native
            npm run test:native
            npm run build:native
            node scripts/verify-native-platform.cjs "${{ matrix.target }}" --load
          '
      - uses: docker/setup-qemu-action@v3
        if: matrix.kind == 'cross'
        with:
          platforms: arm
      - name: Load ARMhf module under emulation
        if: matrix.kind == 'cross'
        shell: bash
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/work" -w /work ubuntu:24.04 bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends nodejs
            node scripts/verify-native-platform.cjs linux-armhf --load
          '
      - name: Smoke-test Node to native operation dispatch
        if: matrix.kind == 'native'
        run: npm run compile && npm run test:binding
      - name: Check native binary
        if: matrix.kind != 'alpine'
        run: node scripts/verify-native-platform.cjs ${{ matrix.target }} ${{ matrix.kind == 'native' && '--load' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - run: node scripts/verify-native-platform.cjs universal
      - name: Package universal VSIX
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          output="vscode-gitk-pro-${version}.vsix"
          npm run compile
          node scripts/package-native-vsix.cjs -o "$output"
          echo "output=$output" >> "$GITHUB_OUTPUT"
      - name: Verify the VSIX contains all native modules
        shell: bash
        env:
          VSIX: ${{ steps.package.outputs.output }}
        run: |
          find native -maxdepth 1 -type f -name '*.node' -printf 'extension/native/%f\n' | sort > expected-native.txt
          unzip -Z1 "$VSIX" | grep '^extension/native/.*\.node$' | sort > actual-native.txt
          diff -u expected-native.txt actual-native.txt
          if unzip -p "$VSIX" extension.vsixmanifest | grep -q 'TargetPlatform'; then
            echo 'Universal VSIX must not contain TargetPlatform metadata' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-gitk-pro-universal
          path: ${{ steps.package.outputs.output }}
          if-no-files-found: error
