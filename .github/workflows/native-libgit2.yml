name: native-libgit2

on:
  push:
  pull_request:

env:
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-gnullvm,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install native cross-build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake perl pkg-config
      - run: npm ci
      - run: npm run check:native && npm run test:native
      - name: Build all native modules into lib
        run: npm run build:native:all
      - name: Verify all generated native modules
        run: npm run verify:native:all
      - name: Package universal VSIX from existing lib outputs
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          output="vscode-gitk-pro-${version}.vsix"
          npx vsce package -o "$output"
          echo "output=$output" >> "$GITHUB_OUTPUT"
      - name: Test the build-host native module
        run: npm run test:binding
      - name: Verify the VSIX contains all native modules
        shell: bash
        env:
          VSIX: ${{ steps.package.outputs.output }}
        run: |
          find lib -mindepth 2 -maxdepth 2 -type f -name '*.node' -printf 'extension/%p\n' | sort > expected-native.txt
          unzip -Z1 "$VSIX" | grep '^extension/lib/[^/]*/.*\.node$' | sort > actual-native.txt
          diff -u expected-native.txt actual-native.txt
          if unzip -p "$VSIX" extension.vsixmanifest | grep -q 'TargetPlatform'; then
            echo 'Universal VSIX must not contain TargetPlatform metadata' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: lib/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-gitk-pro-universal
          path: ${{ steps.package.outputs.output }}
          if-no-files-found: error

  host-smoke:
    needs: build-and-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
            node-architecture: x64
          - target: win32-arm64
            os: windows-11-arm
            node-architecture: arm64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            node-architecture: arm64
          - target: darwin-x64
            os: macos-15-intel
            node-architecture: x64
          - target: darwin-arm64
            os: macos-15
            node-architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node-architecture }}
      - uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: lib
      - name: Load the packaged module without compiling
        run: node scripts/verify-native-platform.cjs ${{ matrix.target }} --load
