<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <!-- 深灰方底 + 纯黑圆底 -->
  <rect width="128" height="128" fill="#121314"/>
  <circle cx="64" cy="64" r="61" fill="#000000"/>

  <!-- 四个 45° 旋转的圆角方块: 上粉 / 左蓝 / 右绿 / 下黄 -->
  <g transform="rotate(45 62 37)"><rect x="46" y="21" width="32" height="32" rx="7" fill="#FF8080"/></g>
  <g transform="rotate(45 35 64)"><rect x="19" y="48" width="32" height="32" rx="7" fill="#80B3FF"/></g>
  <g transform="rotate(45 89 62)"><rect x="73" y="46" width="32" height="32" rx="7" fill="#8DD35F"/></g>
  <g transform="rotate(45 62 92)"><rect x="46" y="76" width="32" height="32" rx="7" fill="#FFE680"/></g>

  <!-- 黑色 git 分支图形: 竖线 + 斜线 + 三个圆形节点 -->
  <g stroke="#000000" stroke-width="7.5" stroke-linecap="round" fill="none">
    <line x1="62.5" y1="42.5" x2="62" y2="91"/>
    <line x1="62.5" y1="42.5" x2="89" y2="62"/>
  </g>
  <g fill="#000000">
    <circle cx="62.5" cy="42.5" r="9"/>
    <circle cx="62" cy="91" r="9"/>
    <circle cx="89" cy="62" r="9"/>
  </g>
</svg>
