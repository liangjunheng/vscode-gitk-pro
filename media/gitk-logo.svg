<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <!-- 深灰方底 + 纯黑圆底 (圆与画布四边相切, 无内边距) -->
  <rect width="128" height="128" fill="#121314"/>
  <circle cx="64" cy="64" r="63.9" fill="#000000"/>

  <!-- 四个 45° 旋转的圆角方块: 上粉 / 左蓝 / 右绿 / 下黄 -->
  <g transform="rotate(45 61.905 35.72)"><rect x="45.145" y="18.96" width="33.52" height="33.52" rx="7.33" fill="#FF8080"/></g>
  <g transform="rotate(45 33.62 64)"><rect x="16.86" y="47.24" width="33.52" height="33.52" rx="7.33" fill="#80B3FF"/></g>
  <g transform="rotate(45 90.19 61.905)"><rect x="73.43" y="45.145" width="33.52" height="33.52" rx="7.33" fill="#8DD35F"/></g>
  <g transform="rotate(45 61.905 93.33)"><rect x="45.145" y="76.57" width="33.52" height="33.52" rx="7.33" fill="#FFE680"/></g>

  <!-- 黑色 git 分支图形: 竖线 + 斜线 + 三个圆形节点 -->
  <g stroke="#000000" stroke-width="7.86" stroke-linecap="round" fill="none">
    <line x1="62.43" y1="41.48" x2="61.905" y2="92.33"/>
    <line x1="62.43" y1="41.48" x2="90.19" y2="61.905"/>
  </g>
  <g fill="#000000">
    <circle cx="62.43" cy="41.48" r="9.43"/>
    <circle cx="61.905" cy="92.33" r="9.43"/>
    <circle cx="90.19" cy="61.905" r="9.43"/>
  </g>
</svg>
