<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 单色版 logo: 上/左/右/下 四个 45° 旋转圆角方块 -->
  <g fill="none" stroke="#C5C5C5" stroke-width="1.1" stroke-linejoin="round">
    <g transform="rotate(45 12 6.4)"><rect x="9.455" y="3.855" width="5.09" height="5.09" rx="1"/></g>
    <g transform="rotate(45 6.4 12)"><rect x="3.855" y="9.455" width="5.09" height="5.09" rx="1"/></g>
    <g transform="rotate(45 17.6 12)"><rect x="15.055" y="9.455" width="5.09" height="5.09" rx="1"/></g>
    <g transform="rotate(45 12 17.6)"><rect x="9.455" y="15.055" width="5.09" height="5.09" rx="1"/></g>
  </g>
  <!-- 分支图: 竖线 + 斜线 -->
  <g stroke="#C5C5C5" stroke-width="1.1" stroke-linecap="round" fill="none">
    <line x1="12" y1="7.4" x2="12" y2="17.6"/>
    <line x1="12" y1="7.4" x2="17.6" y2="12"/>
  </g>
  <!-- 三个 commit 节点 -->
  <g fill="#C5C5C5">
    <circle cx="12" cy="7.4" r="1.25"/>
    <circle cx="12" cy="17.6" r="1.25"/>
    <circle cx="17.6" cy="12" r="1.25"/>
  </g>
</svg>
